<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill-to-Score Coach — IELTS 53-Skill</title>
<meta name="description" content="নিজের দুর্বল skill চিহ্নিত করুন, বাংলায় বুঝুন, timed IELTS task-এ প্রমাণ দিন, আর ভুলটি ঠিক না হওয়া পর্যন্ত review করুন।">
<meta name="theme-color" content="#1f3a5f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231f3a5f'/><text x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>53</text></svg>">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* ===== Skill-to-Score Coach — design tokens ===== */
:root{
  --f-body:"Inter","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Plus Jakarta Sans","Noto Sans Bengali","Inter",system-ui,sans-serif;
  --f-read:"Source Serif 4","Noto Sans Bengali",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px; --r-sm:8px; --gap:16px;
  --rail:252px;
}
:root,[data-theme="light"]{
  --bg:#f5f3ee; --surface:#ffffff; --surface2:#f1eee7; --surface3:#e9e5dc;
  --ink:#1c222b; --ink2:#3a4350; --muted:#5f6875; --line:#e1dcd1; --line2:#cfc8bb;
  --brand:#1f3a5f; --brand-ink:#ffffff; --brand-soft:#e6edf6; --focus:#2d6cdf;
  --ok:#17744a; --ok-soft:#e2f3e9; --bad:#b3261e; --bad-soft:#fbe8e6;
  --trap:#a95500; --trap-soft:#fdefdd; --anchor:#7a5d00; --anchor-soft:#fff4c2;
  --mint:#0e7066; --mint-soft:#dcf3ef; --para:#2457c5; --para-soft:#e4ecfb;
  --a-grammar:#b3245e; --a-writing:#1b7a3f; --a-listening:#6d3fd6; --a-reading:#2359c9; --a-speaking:#0d7467; --a-system:#3d4a5c;
  --shadow:0 1px 2px rgba(20,24,30,.06),0 4px 14px rgba(20,24,30,.05);
}
[data-theme="dark"]{
  --bg:#11151b; --surface:#181e26; --surface2:#1f2630; --surface3:#27303c;
  --ink:#e6eaef; --ink2:#c8d0da; --muted:#98a3b1; --line:#2c3541; --line2:#3a4553;
  --brand:#8db3e6; --brand-ink:#0d1520; --brand-soft:#1d2a3b; --focus:#7fb0ff;
  --ok:#5ccf93; --ok-soft:#15301f; --bad:#ff8a80; --bad-soft:#3a1c1a; --trap:#ffb561; --trap-soft:#3a2810;
  --anchor:#f1d36b; --anchor-soft:#34300f; --mint:#54d1c1; --mint-soft:#12302c; --para:#8fb0ff; --para-soft:#1b2640;
  --a-grammar:#f07aa6; --a-writing:#5fcf86; --a-listening:#b196ff; --a-reading:#7ea6ff; --a-speaking:#4fd0bd; --a-system:#a9b6c7;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
[data-theme="sepia"]{
  --bg:#f3ead6; --surface:#fbf6ea; --surface2:#efe5cf; --surface3:#e6d9bd;
  --ink:#3a2e20; --ink2:#4d3f2d; --muted:#6f604b; --line:#e0d2b4; --line2:#cdbb97;
  --brand:#5a3e1f; --brand-ink:#fffaf0; --brand-soft:#efe1c6; --focus:#9a5b12;
  --shadow:0 1px 2px rgba(60,40,10,.08),0 4px 14px rgba(60,40,10,.06);
}
[data-size="sm"]{font-size:15px} [data-size="md"]{font-size:16px} [data-size="lg"]{font-size:17.5px} [data-size="xl"]{font-size:19px}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.7;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-synthesis-style:none}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.35;margin:0 0 .4em;text-wrap:balance;color:var(--ink)}
h1{font-size:1.65rem;font-weight:750} h2{font-size:1.28rem;font-weight:700} h3{font-size:1.06rem;font-weight:700} h4{font-size:.98rem}
p{margin:0 0 .7em}
a{color:var(--para)} a:hover{text-decoration-thickness:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--brand);color:var(--brand-ink);padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:12px}
.en{font-family:var(--f-read)}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.78rem}
.nowrap{white-space:nowrap}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
kbd{font-family:var(--f-mono);font-size:.8em;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 .35em;background:var(--surface)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface2);padding:.05em .35em;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== shell ===== */
.shell{display:flex;min-height:100vh}
.rail{width:var(--rail);flex:none;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;
  padding:14px 12px 18px;display:flex;flex-direction:column;gap:10px;z-index:40}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:22px 28px 60px}
.main:focus{outline:none}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 10px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.brand .mk{width:38px;height:38px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:800;font-size:15px;flex:none;letter-spacing:-.02em}
.brand b{display:block;font-family:var(--f-display);font-size:15px;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink2);text-decoration:none;font-size:14.5px;line-height:1.35}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--ink);font-weight:650}
.nav a .dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:#fff;flex:none;font-family:var(--f-display)}
.nav a .ct{margin-left:auto;font-size:11.5px;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;line-height:18px;font-weight:700}
.railfoot{margin-top:auto;border-top:1px solid var(--line);padding:10px 8px 0;font-size:12.5px;color:var(--muted)}
.railfoot .bar{height:6px;background:var(--surface3);border-radius:99px;overflow:hidden;margin:6px 0}
.railfoot .bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);}
.topbar .in{max-width:1120px;margin:0 auto;padding:10px 28px;display:flex;align-items:center;gap:12px}
.menubtn{display:none;border:1px solid var(--line2);background:var(--surface);border-radius:9px;width:40px;height:40px;cursor:pointer;flex:none}
.tsearch{flex:1;position:relative;max-width:560px}
.tsearch input{width:100%;height:40px;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:0 12px 0 36px;font-size:14.5px}
.tsearch svg{position:absolute;left:11px;top:11px;color:var(--muted)}
.tdrop{position:absolute;left:0;right:0;top:46px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);max-height:70vh;overflow:auto;padding:6px;z-index:50}
.tdrop a{display:block;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink)}
.tdrop a:hover,.tdrop a.sel{background:var(--surface2)}
.tdrop .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 10px 2px;font-weight:700}
.tbtns{display:flex;gap:6px;margin-left:auto}
.iconbtn{border:1px solid var(--line2);background:var(--surface);border-radius:9px;height:40px;min-width:40px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;color:var(--ink2);text-decoration:none}
.iconbtn:hover{background:var(--surface2)}
.foot{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.foot .in{max-width:1120px;margin:0 auto;padding:14px 28px 26px;display:flex;flex-wrap:wrap;gap:6px 18px}
.foot a{color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:35}

@media (max-width:900px){
  .rail{position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .rail.open{transform:none}
  .menubtn{display:inline-grid;place-items:center}
  .main{padding:16px 16px 70px}
  .topbar .in{padding:8px 16px}
  .foot .in{padding:14px 16px 26px}
  .tbtns .hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ===== building blocks ===== */
.page-h{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin:4px 0 18px}
.page-h .t{flex:1;min-width:240px}
.page-h h1{margin:0;overflow-wrap:anywhere}
.page-h .sub{color:var(--muted);margin:.25em 0 0;overflow-wrap:anywhere}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--muted)}
.grid{display:grid;gap:var(--gap)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1000px){.g4,.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)} .g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card.tight{padding:14px}
.card h2,.card h3{margin-top:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-h h2,.card-h h3{margin:0;flex:1}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:9px 16px;font-weight:600;font-size:.94rem;cursor:pointer;text-decoration:none;line-height:1.3;min-height:42px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 11px;min-height:34px;font-size:.86rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 10px;font-size:12.5px;font-weight:600;border:1px solid var(--line2);background:var(--surface2);color:var(--ink2);line-height:1.6;max-width:100%}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.trap{background:var(--trap-soft);border-color:transparent;color:var(--trap)}
.chip.mint{background:var(--mint-soft);border-color:transparent;color:var(--mint)}
.chip.para{background:var(--para-soft);border-color:transparent;color:var(--para)}
.chip.plan{border-style:dashed;background:transparent;color:var(--muted)}
.sec-dot{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;color:#fff;font-weight:800;font-size:12px;font-family:var(--f-display);flex:none}
.acc-grammar{--acc:var(--a-grammar)} .acc-writing{--acc:var(--a-writing)} .acc-listening{--acc:var(--a-listening)}
.acc-reading{--acc:var(--a-reading)} .acc-speaking{--acc:var(--a-speaking)} .acc-system{--acc:var(--a-system)}
.bg-acc{background:var(--acc)} .c-acc{color:var(--acc)}
.bar{height:8px;background:var(--surface3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc,var(--ok));border-radius:99px}
.note{border-left:4px solid var(--line2);background:var(--surface2);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.note.ok{border-color:var(--ok);background:var(--ok-soft)} .note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.trap{border-color:var(--trap);background:var(--trap-soft)} .note.mint{border-color:var(--mint);background:var(--mint-soft)}
.note.para{border-color:var(--para);background:var(--para-soft)}
.note p:last-child{margin-bottom:0}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:18px;color:var(--muted);text-align:center;background:transparent}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.93rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto;scrollbar-width:thin}
.tabs a,.tabs button{border:0;background:none;padding:9px 14px;border-bottom:3px solid transparent;color:var(--muted);text-decoration:none;font-weight:600;cursor:pointer;white-space:nowrap;font-size:.94rem}
.tabs .on{color:var(--ink);border-bottom-color:var(--acc,var(--brand))}
table.t{border-collapse:collapse;width:100%;font-size:.92rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tblwrap{overflow-x:auto}
.list{list-style:none;margin:0;padding:0}
.list>li{padding:10px 0;border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;
  font-size:14px;opacity:0;pointer-events:none;transition:all .2s ease;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,14,20,.5);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal .box h2{margin-top:0}
input.in,select.in,textarea.in{border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:8px 11px;min-height:42px;width:100%}
textarea.in{min-height:110px;resize:vertical;line-height:1.6}
label.f{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
.help{font-size:.84rem;color:var(--muted);margin-top:3px}

/* ===== dashboard ===== */
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.hero .card{padding:14px 16px}
.hero .k{font-size:.8rem;color:var(--muted);font-weight:600}
.hero .v{font-family:var(--f-display);font-size:1.5rem;font-weight:750;line-height:1.25;font-variant-numeric:tabular-nums}
.hero .s{font-size:.84rem;color:var(--muted)}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.actions{counter-reset:act}
.action{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.action:last-child{border-bottom:0}
.action .n{counter-increment:act;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;font-family:var(--f-display)}
.action .n::before{content:counter(act)}
.action .b{flex:1;min-width:0}
.action .b b{display:block}
.action .b span{font-size:.88rem;color:var(--muted)}
.rings{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){.rings{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ring{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink);padding:8px 4px;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer}
.ring:hover{background:var(--surface2);border-color:var(--line)}
.ring svg{display:block}
.ring .rv{font-family:var(--f-display);font-weight:750;font-size:1rem}
.ring .rl{font-size:.84rem;font-weight:600}
.ring .rs{font-size:.74rem;color:var(--muted)}
.why{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.8rem;text-decoration:underline dotted;padding:0}
.sessrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sessrow .sc{font-family:var(--f-mono);font-weight:600;min-width:64px}
.weekbars{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.weekbars .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.weekbars .d i{display:block;width:100%;max-width:34px;background:var(--brand);border-radius:6px 6px 2px 2px;min-height:2px}
.weekbars .d.today i{background:var(--ok)}
.weekbars .d span{font-size:.72rem;color:var(--muted)}
.onboard{border:2px solid var(--brand);background:var(--brand-soft)}

/* ===== skills ===== */
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.sk{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--acc);
  border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.sk:hover{border-color:var(--line2);border-left-color:var(--acc)}
.sk .top{display:flex;align-items:center;gap:8px}
.sk .num{font-family:var(--f-mono);font-weight:600;color:var(--acc);font-size:.86rem}
.sk .nm{font-weight:700;line-height:1.35}
.sk .bn{font-size:.86rem;color:var(--muted);line-height:1.4}
.sk .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.mscale{display:inline-flex;gap:3px;align-items:center}
.mscale i{width:14px;height:8px;border-radius:3px;background:var(--surface3);display:block}
.mscale i.f{background:var(--acc,var(--ok))}
.mscale b{font-size:.78rem;margin-left:5px;color:var(--ink2);font-weight:700}
.ladder{display:grid;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink)}
a.step:hover{background:var(--surface2)}
.step .ix{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;border:2px solid var(--line2);color:var(--muted);font-family:var(--f-display)}
.step.done .ix{background:var(--ok);border-color:var(--ok);color:#fff}
.step.next{border-color:var(--acc,var(--brand));box-shadow:0 0 0 2px color-mix(in srgb,var(--acc,var(--brand)) 20%,transparent)}
.step.next .ix{border-color:var(--acc,var(--brand));color:var(--acc,var(--brand))}
.step.na{opacity:.62}
.step .b{flex:1;min-width:0}
.step .b b{display:block;font-size:.95rem}
.step .b span{font-size:.84rem;color:var(--muted)}
.sk-head{border-left:6px solid var(--acc);padding-left:14px}
.sk-head .num{font-family:var(--f-mono);color:var(--acc);font-weight:600}
.pre{display:flex;flex-direction:column;gap:6px}

বদলানো", "items": ["d7", "d8"]}], "rule": {"skeleton": "P: ____ → ____\nS: ____ → ____\nরায়: ✅ / ❌ (কোন চেক?)", "blocks": [{"h": "১ · চার ঘর", "t": "প্রতিটা বাক্যকে নামাও: ① কে · ② কী করল (**active রূপে**, tense সহ) · ③ কাকে/কী · ④ বাড়তি (কখন/কোথায়/কীভাবে)।\nশব্দ নয় — **ঘর মেলাও**।"}, {"h": "২ · কাঁচি", "t": "although · because · once · after · before · which · who — এখানে বাক্য কাটো।\n**একটি verb = একটি কঙ্কাল।** which/who-এর কর্তা = ঠিক আগের noun।"}, {"h": "৩ · Passive", "t": "**be + V3** দেখলে তবেই ঘর বদলাও: সামনের noun ③ ঘরে, by-এর পরেরটা ① ঘরে।\nhas risen (have + V3) = active — কর্তা যেখানে ছিল সেখানেই।"}, {"h": "৪ · তীর", "t": "তীরের বাঁ পাশে সবসময় **কারণ / আগের ঘটনা**। caused · led to → বাঁ → ডান।\nresulted from · owing to · due to · stems from → এদের **পরের** অংশই কারণ। A after B → B আগে।"}, {"h": "৫ · মই", "t": "some → all · many → every · often → always · may → does · suggest → prove = **অবৈধ**।\nমই বেয়ে লাফ মানেই রায় ❌।"}, {"h": "৬ · নতুন তথ্য", "t": "S-এ এমন কিছু যা P বলেনি (first used → invented, adults → adults and children) = অবৈধ।\nতালিকা → ছাতা-শব্দ (paintings, sculptures → artworks) বৈধ; উল্টোটা নয়।"}], "motto": "শব্দ মিলে গেলে খুশি হবে না — শব্দ মিল সন্দেহের কারণ, প্রমাণ নয়। চার চেক পাশ করলে তবেই “বৈধ”।", "notes": ["s10-paraphrase-recognition-masternote", "s10-paraphrase-recognition-examcard", "s10-signal-word-bank"]}, "worked_opts": "judge5", "worked": [{"id": "w1", "p": "The council approved the plan after lengthy consultation with local residents.", "s": "The plan was given approval once local residents had been extensively consulted.", "steps": [{"h": "ধাপ ক — কাঁচি", "t": "P: approved | consultation (after-এ কাটা)। S: was given approval | had been consulted (once-এ কাটা)। দুই বাক্যেই দুই কঙ্কাল।"}, {"h": "ধাপ খ — ঘর", "t": "S passive: the plan ③ ঘরে, কর্তা উহ্য (council)। approve ↔ give approval একই কাজ। lengthy ↔ extensively — মাত্রা এক।"}, {"h": "ধাপ গ — তীর", "t": "P: after-এর পরেরটা আগে → consultation → approval। S: **once = after** (“one” নয়) → consultation → approval। একই দিক।"}, {"h": "ধাপ ঘ — মই ও নতুন তথ্য", "t": "মাত্রা লাফ নেই, নতুন তথ্য নেই।"}], "verdict": 0, "why": "চার চেকই পাশ। মনে রাখো — শুরুতে ঠিক এই once-এর জন্য বৈধ paraphrase বাতিল করেছিলে (E41)।"}, {"id": "w2", "p": "Rising costs forced the museum to close.", "s": "The museum's closure forced costs to rise.", "steps": [{"h": "ধাপ ক — কাঁচি", "t": "দুটোই এক কঙ্কাল: X forced Y to happen।"}, {"h": "ধাপ খ — ঘর", "t": "শব্দ প্রায় হুবহু: costs, museum, close/closure, rise — এটাই ফাঁদ।"}, {"h": "ধাপ গ — তীর", "t": "P: costs → closure। S: closure → costs। **কারণ-তীর উল্টো।**"}], "verdict": 2, "why": "শব্দ মিল দেখে “বৈধ” বলা = তোমার পক্ষপাত ১ (E46)। তীর হাতে লিখলেই ধরা পড়ে।"}, {"id": "w3", "p": "Some economists argue that automation will reduce employment.", "s": "Economists have demonstrated that automation reduces employment.", "steps": [{"h": "ধাপ ক — ঘর ও তীর", "t": "দুটোতেই automation → employment কমা। তীর এক।"}, {"h": "ধাপ খ — মই (পরিমাণ)", "t": "Some economists → Economists (সবাই বোঝায়)। পরিমাণের মই লাফ।"}, {"h": "ধাপ গ — মই (নিশ্চয়তা)", "t": "argue (মতামত, স্তর ২) → demonstrated (প্রমাণ, স্তর ৫)। will reduce → reduces।"}], "verdict": 3, "why": "দুই রকম মই-লাফ একসাথে। argue/suggest/may থেকে prove/show/does = সবসময় অবৈধ।"}], "items": {"d1": {"q": "নিচের কোনটা দেখলে তবেই passive ধরে ঘর অদল-বদল করবে?", "opts": ["be-verb + V3 (যেমন **was relocated**)", "have + V3 (যেমন **has risen**)", "বাক্যে **by** শব্দটা আছে", "যেকোনো V3 বা -ed রূপ"], "ans": 0, "why": "ঘর বদলায় **শুধু be + V3**-এ। has risen = perfect active — কর্তা ① ঘরেই থাকে। by না থাকলেও passive হতে পারে।", "trap": "E44", "cat": "R"}, "d2": {"q": "`The decline resulted from pesticide use.` — কারণ কোনটা?", "opts": ["pesticide use → decline", "decline → pesticide use", "এখানে কারণ-ফল নেই"], "ans": 0, "why": "resulted **from**-এর পরের অংশই কারণ। বাক্যে আগে লেখা আছে বলে decline কারণ নয়।", "trap": "E42", "cat": "A"}, "d3": {"p": "The committee rejected the proposal after udge5", "ans": 0, "hint": "has **been** damaged = be + V3 → by-এর পরের noun-ই কর্তা।", "why": "দুই বাক্যেই temperatures → reef-এর ক্ষতি। passive ↔ active, damage ↔ harm।", "trap": "E41", "cat": "V"}, "g2": {"p": "Attendance improved once the timetable was simplified.", "s": "The timetable was simplified once attendance improved.", "opts": "judge5", "ans": 2, "hint": "once = after। once-এর পরের ঘটনাটা আগে ঘটেছে।", "why": "P: timetable সহজ → attendance বাড়ল। S: attendance বাড়ল → timetable সহজ। সময়-তীর উল্টো।", "trap": "E43", "cat": "A"}, "g3": {"p": "The shortage of housing arose from a sharp rise in migration.", "s": "A sharp rise in migration produced a shortage of housing.", "opts": "judge5", "ans": 0, "hint": "arose from-এর পরের অংশ কী?", "why": "arose from-এর পরেরটা কারণ: migration → shortage। S-এও migration → shortage।", "trap": "E41", "cat": "V"}, "g4": {"p": "Many of the students found the module challenging.", "s": "All of the students found the module challenging.", "opts": "judge5", "ans": 3, "hint": "পরিমাণের মই: many আর all কি এক ধাপে?", "why": "Many → All = পরিমাণের মই বেয়ে লাফ।", "trap": "E46", "cat": "L"}, "g5": {"p": "The introduction of the levy took place in 2018.", "s": "The levy was introduced in 2018.", "opts": "judge5", "ans": 0, "hint": "the introduction of + খালি verb (took place) = আসল কাজ কী?", "why": "the introduction of … took place = was introduced। ④ ঘর (in 2018) এক।", "trap": "E41", "cat": "V"}, "g6": {"p": "Fuel consumption fell as a result of tighter emission standards.", "s": "Tighter emission standards were introduced because fuel consumption fell.", "opts": "judge5", "ans": 2, "hint": "as a result of-এর পরের অংশই কারণ।", "why": "P: standards → consumption কমা। S: consumption কমা → standards। কারণ উল্টো।", "trap": "E42", "cat": "A"}, "g7": {"p": "The inspectors questioned the manager about the missing funds.", "s": "The manager questioned the inspectors about the missing funds.", "opts": "judge5", "ans": 1, "hint": "① কে প্রশ্ন করল, ③ কাকে?", "why": "P: ① inspectors ③ manager। S: ① manager ③ inspectors। কর্তা আর target জায়গা বদলেছে।", "trap": "E44", "cat": "R"}, "g8": {"p": "Scientists discovered the fossil in a limestone quarry.", "s": "The discovery of the fossil took place in a limestone quarry.", "opts": "judge5", "ans": 0, "hint": "discovered → the discovery of — কাজ কি উধাও, নাকি শুধু পোশাক বদল?", "why": "Nominalisation + খালি verb। ② ③ ④ হুবহু এক; ① (scientists) শুধু চেপে রাখা — নতুন তথ্য নয়।", "trap": "E41", "cat": "V"}, "g9": {"p": "The new vaccine was tested on 500 volunteers.", "s": "The new vaccine was developed with the help of 500 volunteers.", "opts": "judge5", "ans": 4, "hint": "② ঘরের কাজটা কি একই — test আর develop?", "why": "tested (পরীক্ষা) ≠ developed (তৈরি)। S এমন কাজ বলছে যা P বলেনি।", "trap": "E46", "cat": "N"}, "g10": {"p": "The software was first used in schools in 1995.", "s": "The software was invented in 1995.", "opts": "judge5", "ans": 4, "hint": "first used আর invented কি একই ঘটনা?", "why": "প্রথম ব্যবহার ≠ আবিষ্কার। আবিষ্কার আগেও হতে পারে — এটা নতুন দাবি।", "trap": "E46", "cat": "N"}, "g11": {"p": "The exhibition featured paintings, sculptures and ceramics.", "s": "The exhibition featured a range of artworks.", "opts": "judge5", "ans": 0, "hint": "তালিকা → ছাতা-শব্দ কোন দিকে গেলে বৈধ?", "why": "specific → general (তালিকা → artworks) বৈধ। উল্টো দিকে গেলে নতুন তথ্য ঢুকত।", "trap": "E41", "cat": "V"}, "g12": {"p": "The landlord sold the building to a local charity.", "s": "A local charity bought the building from the landlord.", "opts": "judge5", "ans": 0, "hint": "sold to ↔ bought from — জোড়-verb।", "why": "একই ঘটনা দুই দিক থেকে (X sold to Y = Y bought from X)। ঘর ঠিক জায়গায় আছে।", "trap": "E41", "cat": "V"}, "b1": {"p": "Engineers completed the survey before the tunnel was approved.", "s": "The tunnel was approved after the survey had been completed.", "opts": "judge5", "ans": 0, "why": "before-এর আগেরটা আগে, after-এর পরেরটা আগে — দুটোতেই survey আগে, approval পরে।", "trap": "E41", "cat": "V"}, "b2": {"p": "Scientists suspect that the compound may slow ageing.", "s": "Scientists have confirmed that the compound slows ageing.", "opts": "judge5", "ans": 3, "why": "suspect + may → confirmed + slows। নিশ্চয়তার মই লাফ।", "trap": "E46", "cat": "L"}, "b3": {"p": "The library was funded by a bequest from a local merchant.", "s": "A local merchant left money which paid for the library.", "opts": "judge5", "ans": 0, "why": "bequest = মৃত্যুর পরে রেখে যাওয়া টাকা; funded = খরচ দিল। কারণ একই দিকে: merchant-এর টাকা → library।", "trap": "E41", "cat": "V"}, "b4": {"p": "The spread of the disease was contained by strict quarantine measures.", "s": "Strict quarantine measures prevented the disease from spreading widely.", "opts": "judge5", "ans": 0, "why": "P passive (was contained by), S active (prevented)। দুটোতেই কারণ quarantine measures।", "trap": "E41", "cat": "V"}, "b5": {"p": "Sales declined sharply after the new tax was introduced.", "s": "The new tax was introduced after sales declined sharply.", "opts": "judge5", "ans": 2, "why": "দুই বাক্যেই after, তবু ক্রম উল্টো। P: tax → sales কমা। S: sales কমা → tax।", "trap": "E43", "cat": "A"}, "b6": {"p": "The farmers were warned by the agency about the approaching drought.", "s": "The farmers warned the agency about the approaching drought.", "opts": "judge5", "ans": 1, "why": "P: be + V3 + by → ① agency ③ farmers। S: ① farmers ③ agency। ঘর উল্টো।", "trap": "E44", "cat": "R"}, "b7": {"p": "The study found that most commuters prefer trains to buses.", "s": "According to the study, the majority of commuters would rather take the train than the bus.", "opts": "judge5", "ans": 0, "why": "most = the majority (একই ধাপ)। prefer X to Y = would rather X than Y। found ↔ according to।", "trap": "E41", "cat": "V"}, "b8": {"p": "Pollution in the river is often linked to nearby farms.", "s": "Pollution in the river is always linked to nearby farms.", "opts": "judge5", "ans": 3, "why": "often → always = কম্পাঙ্কের মই লাফ।", "trap": "E46", "cat": "L"}, "b9": {"p": "The museum's collection includes coins from the Roman period.", "s": "The museum's collection consists entirely of Roman coins.", "opts": "judge5", "ans": 3, "why": "includes = সংগ্রহের একটা অংশ; consists entirely = পুরোটাই। “কিছু” থেকে “সব” — পরিমাণের মই লাফ।", "trap": "E46", "cat": "L"}, "b10": {"p": "A decline in bee numbers has been caused by certain pesticides.", "s": "A decline in bee numbers has been caused by certain pesticides used on wheat farms.", "opts": "judge5", "ans": 4, "why": "“used on wheat farms” — কোথায় ব্যবহার, সেটা P বলেনি। S নতুন তথ্য জুড়েছে।", "trap": "E46", "cat": "N"}, "b11": {"p": "The bank lent the company two million dollars.", "s": "The company borrowed two million dollars from the bank.", "opts": "judge5", "ans": 0, "why": "lent to ↔ borrowed from — জোড়-verb। একই ঘটনা, দুই দিক।", "trap": "E41", "cat": "V"}, "b12": {"p": "Following the merger, several senior managers resigned.", "s": "Several senior managers resigned, which led to the merger.", "opts": "judge5", "ans": 2, "why": "Following X = X আগে: merger → resignations। S: resignations → merger। তীর উল্টো।", "trap": "E43", "cat": "A"}, "ga1": {"p": "The storm destroyed dozens of fishing boats along the coast.", "s": "The destruction of dozens of fishing boats along the coast was caused by the storm.", "opts": "judge5", "ans": 0, "why": "destroyed → the destruction of। was caused by-এর পরেরটা কারণ: storm → destruction। এক।", "trap": "E41", "cat": "V"}, "ga2": {"p": "The minister was criticised by several journalists over the delay.", "s": "The minister criticised several journalists over the delay.", "opts": "judge5", "ans": 1, "why": "P: journalists ① → minister ③। S: minister ① → journalists ③। ঘর উল্টো।", "trap": "E44", "cat": "R"}, "ga3": {"p": "The price of wheat rose because the harvest failed.", "s": "The failure of the harvest resulted in a rise in the price of wheat.", "opts": "judge5", "ans": 0, "why": "because-এর পরেরটা কারণ: harvest failed → price rose। resulted in: failure → rise। এক দিক।", "trap": "E41", "cat": "V"}, "ga4": {"p": "Road accidents decreased once speed cameras were installed.", "s": "Speed cameras were installed once road accidents had decreased.", "opts": "judge5", "ans": 2, "why": "P: cameras → accidents কমা। S: accidents কমা → cameras। once-এর পরের ঘটনা আগে — ক্রম উল্টো।", "trap": "E43", "cat": "A"}, "ga5": {"p": "The report suggests that remote work might improve productivity.", "s": "The report shows that remote work improves productivity.", "opts": "judge5", "ans": 3, "why": "suggests + might → shows + improves। নিশ্চয়তার মই লাফ।", "trap": "E46", "cat": "L"}, "ga6": {"p": "A few of the participants reported side effects.", "s": "Most of the participants reported side effects.", "opts": "judge5", "ans": 3, "why": "a few → most = পরিমাণের মই লাফ।", "trap": "E46", "cat": "L"}, "ga7": {"p": "The tunnel was built by a Swedish engineering firm in 2004.", "s": "A Swedish engineering firm constructed the tunnel in 2004.", "opts": "judge5", "ans": 0, "why": "was built by → firm ①। build = construct। ④ in 2004 এক।", "trap": "E41", "cat": "V"}, "ga8": {"p": "The garden contains roses, tulips and lilies.", "s": "The garden contains several kinds of flowers.", "opts": "judge5", "ans": 0, "why": "তালিকা → ছাতা-শব্দ (several kinds of flowers) বৈধ।", "trap": "E41", "cat": "V"}, "ga9": {"p": "The drug was approved for use in adults.", "s": "The drug was approved for use in adults and children.", "opts": "judge5", "ans": 4, "why": "children — P-তে নেই। S নতুন তথ্য জুড়েছে।", "trap": "E46", "cat": "N"}, "ga10": {"p": "The protests led to the resignation of the mayor.", "s": "The mayor's resignation led to the protests.", "opts": "judge5", "ans": 2, "why": "P: protests → resignation। S: resignation → protests। কারণ-তীর উল্টো।", "trap": "E42", "cat": "A"}, "ga11": {"p": "The new policy was introduced after the elections.", "s": "The elections took place before the new policy was introduced.", "opts": "judge5", "ans": 0, "why": "P: elections → policy (after-এর পরেরটা আগে)। S: before-এর আগেরটা আগে → elections → policy। এক।", "trap": "E41", "cat": "V"}, "ga12": {"p": "The researchers interviewed forty nurses.", "s": "Forty nurses interviewed the researchers.", "opts": "judge5", "ans": 1, "why": "① researchers ③ nurses → S-এ উল্টো। শব্দ একই, ঘর বদল।", "trap": "E44", "cat": "R"}, "gb1": {"p": "The earthquake damaged the old cathedral.", "s": "The old cathedral was damaged by the earthquake.", "opts": "judge5", "ans": 0, "why": "active → passive, by-এর পরে earthquake — ① ঘর ঠিক।", "trap": "E41", "cat": "V"}, "gb2": {"p": "Critics argue that the film is too long.", "s": "Critics have established that the film is too long.", "opts": "judge5", "ans": 3, "why": "argue (মতামত) → established (প্রমাণিত) = নিশ্চয়তার মই লাফ।", "trap": "E46", "cat": "L"}, "gb3": {"p": "The plant closed as a result of falling demand.", "s": "Demand fell as a result of the plant closing.", "opts": "judge5", "ans": 2, "why": "P: demand কমা → plant বন্ধ। S: plant বন্ধ → demand কমা। কারণ উল্টো।", "trap": "E42", "cat": "A"}, "gb4": {"p": "The coach praised the young players after the match.", "s": "The young players praised the coach after the match.", "opts": "judge5", "ans": 1, "why": "① coach ③ players → S-এ উল্টো।", "trap": "E44", "cat": "R"}, "gb5": {"p": "The valley was flooded regularly before the construction of the dam.", "s": "Before the dam was constructed, the valley was regularly flooded.", "opts": "judge5", "ans": 0, "why": "the construction of the dam ↔ the dam was constructed। শুধু বাক্যাংশের জায়গা বদল — ক্রম এক।", "trap": "E41", "cat": "V"}, "gb6": {"p": "Some patients recovered within a week.", "s": "Every patient recovered within a week.", "opts": "judge5", "ans": 3, "why": "Some → Every = পরিমাণের মই লাফ।", "trap": "E46", "cat": "L"}, "gb7": {"p": "The company was founded by two brothers in 1921.", "s": "Two brothers established the comp
